# ═══════════════════════════════════════════════════════════════════════════
# ci.yml — static checks on push and pull requests.
#
# The repo is maintained at zero findings: structure, compose, hooks, and the
# landing page stay conformant. Attribution guard lives in its own workflow.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conformant structure
        run: |
          set -euo pipefail
          for f in README.md LICENSE .env.example web/landing/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file: $f"
              exit 1
            fi
          done
          echo "structure: ok"

      - name: .gitignore covers .env
        run: |
          set -euo pipefail
          if ! grep -q '^\.env' .gitignore; then
            echo "::warning:: .gitignore does not list .env"
          fi

  landing:
    name: Landing page sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Landing sanity
        run: |
          set -euo pipefail
          f=web/landing/index.html
          grep -qi '<title>' "$f" || { echo "::error::landing has no <title>"; exit 1; }
          grep -qi 'og:title' "$f" || { echo "::error::landing has no og:title"; exit 1; }
          echo "landing: ok"

  scripts:
    name: Shell and script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax
        run: |
          set -euo pipefail
          for f in stack.sh scripts/*.sh; do bash -n "$f"; done
          echo "bash -n: ok"

      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning stack.sh scripts/*.sh
          echo "shellcheck: ok"

      # The migration tool's unit tests cover what moves: declared services,
      # the restore plans, vault references and the streaming pack paths.
      # Docker is faked at the module boundary, so no daemon is needed here.
      - name: migrate-stack tests
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests -v

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py scripts/tests/*.py
