# Shared subscribe portal — one nginx, every service's subscribe page.
#
# Serves web/subscribe/pages/<service>.html by Host header:
#   subscribe.<service>.innotel.us -> pages/<service>.html
#   subscribe.innotel.us (apex)    -> pages/index.html (all services)
#
# Publishes host port 3040 (free on .46 — the 30xx range is taken by the
# product portals). The edge NPM forwards subscribe.*.innotel.us here.
#
# Regenerate the pages after changing any service's brand spec:
#   python3 ../scripts/sync-subscribe-pages.py   (from the stack repo root)
# or from anywhere:
#   python3 /usr/src/projects/complete/ips/scripts/sync-subscribe-pages.py

services:
  subscribe-portal:
    container_name: subscribe-portal
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3040:80"
    volumes:
      # generated pages: web/subscribe/pages -> /usr/share/nginx/html/pages
      - ./pages:/usr/share/nginx/html/pages:ro
      # the apex page (all services) IS the site index — mounted over nginx's
      # default "Welcome to nginx" index.html
      - ./pages/index.html:/usr/share/nginx/html/index.html:ro
      # the by-Host-header page picker
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
