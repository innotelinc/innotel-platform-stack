# Shared subscribe portal — one container, one page per service.
#
# Every subscribe.<service>.<zone> host points here (via the edge NPM) — the
# page is picked purely by Host header, so adding a service is a page in
# pages/ — no new deployments. The zone is deliberately not matched: a service
# whose own domain lives under another TLD (e.g. subscribe.rizzaura.net) gets
# the same page as its innotel.us host.
#
# Served from .46:3040 (host port 3040 -> container 80). :3000-family ports
# are taken; 3040 was free.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # subscribe.<service>.<zone> -> pages/<service>.html, whatever the zone
    # (innotel.us, rizzaura.net, …). Everything else — subscribe.innotel.us, an
    # unknown service, a zone with no page — falls through to the apex grid.
    #
    # try_files cannot mix named locations and files in one directive, and a
    # bare `if` inside `location /` breaks it — so do the whole thing in a
    # rewrite stage instead: resolve $svc from the Host, then rewrite to the
    # page when the Host matched. A miss (unknown service) falls through to
    # $uri, which does not exist, and then to /index.html (the apex grid).
    # The `-f` test below is what actually decides: the regex only needs to
    # capture the first label after `subscribe.`.
    set $svc "";
    if ($host ~* ^subscribe\.([a-z0-9-]+)\.) {
        set $svc $1;
    }
    if (-f $document_root/pages/$svc.html) {
        rewrite ^ /pages/$svc.html last;
    }

    location / {
        try_files $uri /index.html;
    }

    # The price fetch goes to Magnate directly from the browser (CORS is open
    # on /api/plans), so no proxying here — this server stays static-only.

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
