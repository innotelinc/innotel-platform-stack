# The panel is reached over the reverse SSH tunnel from the Coolify host
# (127.0.0.1:8090). The same peer is listed twice on purpose: nginx only retries
# via proxy_next_upstream when another peer exists, and this makes the retry go
# back to the same address instead of giving up with a 502.
upstream coolify_panel_retry {
    server 127.0.0.1:8090 max_fails=0;
    server 127.0.0.1:8090 max_fails=0;
    keepalive 8;
}
