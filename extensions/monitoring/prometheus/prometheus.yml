global:
  scrape_interval: 15s
  evaluation_interval: 15s

# The same receiver the per-host variant uses: the estate's one Alertmanager, at
# its container address (`192.168.1.44:9093`, published on `0.0.0.0` by Signara's
# stack on i3). This compose mounts `rules/` as well, so a mesh-attached
# Prometheus without this section evaluates the estate's rules and drops them
# silently — the per-host stacks' defect, on the other variant.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["192.168.1.44:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Consul-based auto-discovery
  - job_name: 'consul-services'
    consul_sd_configs:
      - server: 'consul:8500'
        services: []
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_tags]
        target_label: tags

  # Direct targets for local services
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
