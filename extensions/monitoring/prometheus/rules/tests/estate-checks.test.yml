  - name: a zero-byte config names the app, not the check
    interval: 1m
    input_series:
      - series: 'innotel_estate_media_app_config_bytes{app="sonarr"}'
        values: '0x10'
      - series: 'innotel_estate_media_app_config_bytes{app="radarr"}'
        values: '4096x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: EstateMediaAppConfigEmpty
        exp_alerts:
          - exp_labels: {severity: critical, team: platform, app: sonarr}
            exp_annotations:
              summary: 'sonarr has a zero-byte config file'
              description: 'The app a request crosses has a settings file with no bytes in it — the shape an OOM kill leaves when it lands mid-write, and the app then refuses to start after its next restart while `docker ps` still prints Up for it. Restore it from that app''s own `Backups/scheduled` archive; **do not delete it**, because the app regenerates one with a new API key and the request UI in front of it keeps pointing at the old one.'

  # An unreadable probe is a different repair from a truncated file, so it is a different
  # alert — and it waits longer, because a container mid-restart answers `-1` briefly.
  - name: an unreadable config is its own alert and only after fifteen minutes
    interval: 1m
    input_series:
      - series: 'innotel_estate_media_app_config_bytes{app="prowlarr"}'
        values: '-1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: EstateMediaAppConfigUnreadable
        exp_alerts: []
      - eval_time: 16m
        alertname: EstateMediaAppConfigUnreadable
        exp_alerts:
          - exp_labels: {severity: warning, team: platform, app: prowlarr}
            exp_annotations:
              summary: 'prowlarr has no readable config file'
              description: 'The config probe could not read the app''s settings file at all: a path that is not there, or a container that cannot `stat` it. That is a different repair from a truncated file, which is why it is a separate alert rather than the same one with a different message.'

  # The solver's `oom_kill` is a *cumulative* cgroup counter, so the rule has to read its
  # rate: a container that killed itself before and is healthy now must not stay red.
  - name: a solver still being killed fires, a solver that was killed before does not
    interval: 1m
    input_series:
      - series: 'innotel_estate_media_app_solver_oom_kills{app="flaresolverr"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: EstateMediaAppSolverKillingItself
        exp_alerts:
          - exp_labels: {severity: warning, team: platform, app: flaresolverr}
            exp_annotations:
              summary: 'flaresolverr is being OOM-killed inside its own cap'
              description: 'The solver `prowlarr` sends indexer challenges to was killed 10 time(s) in the last hour inside its own cgroup. Every solve that dies this way is an indexer `prowlarr` cannot reach, and no door in front of the media estate shows it: the app reads `running` and its page loads. Size the cap to measured use plus headroom (`mem_limit: 3g` since 2026-11-17) and keep `shm_size: 1g` — the 64 MB `/dev/shm` is what started this.'

  - name: a solver that is no longer dying stops alarming
    interval: 1m
    input_series:
      - series: 'innotel_estate_media_app_solver_oom_kills{app="flaresolverr"}'
        values: '7x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: EstateMediaAppSolverKillingItself
        exp_alerts: []

  - name: a textfile that is still scraped but frozen is a check that is not running
    interval: 1m
    input_series:
      - series: 'innotel_estate_check_last_run_timestamp{check="mail_identities"}'
        values: '0x300'
      - series: 'innotel_estate_check_last_success_timestamp{check="mail_identities"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: EstateCheckNotRunning
        exp_alerts:
          - exp_labels: {severity: critical, team: platform, check: mail_identities}
            exp_annotations:
              summary: 'The mail_identities check has not run in two hours'
              description: 'The last `mail_identities` run reported 4h 0m 0s ago, so its textfile is still being scraped but has not moved since. The timer that runs it is stopped, or every run since died before writing: nothing is watching this invariant now, whatever the last reading said. Check `systemctl list-timers estate-checks.timer` and the unit''s journal on the edge.'

  # A note is the check's honest way of saying "this half was not exercised" and the wrong
  # place for it to stay: the writer and the stanza keep passing, so nothing else in the
  # estate ever mentions that a reader's refusal is unproven. Five hours is quiet, seven is
  # not — the boundary is the `for: 6h` in the rule.
  - name: an unexercised reader half alerts after six hours
    interval: 1m
    input_series:
      - series: 'innotel_estate_check_note{check="scan_share",code="reader_unproven",detail="no reader"}'
        values: '1x420'
    alert_rule_test:
      - eval_time: 5h
        alertname: EstateScanShareReaderUnproven
        exp_alerts: []
      - eval_time: 7h
        alertname: EstateScanShareReaderUnproven
        exp_alerts:
          - exp_labels: {severity: warning, team: platform, check: scan_share, code: reader_unproven, detail: 'no reader'}
            exp_annotations:
              summary: 'The Scans share has no configured reader, so its refusal is unproven'
              description: '`check-scan-share.py` has published `reader_unproven` for six hours: no `SCAN_SHARE_READ_USER`/`SCAN_SHARE_READ_PASSWORD` is set in `/etc/innotel/estate-checks.env`, so the half of the rule that keeps the household from overwriting scans is not being exercised — the writer and the stanza still pass, which is why the check reads green while this is true. Set both to an account in `[Scans]`''s `valid users` that is not in its `write list` (`scan-reader`, added for exactly this), and the note disappears.'

  # The note is *absent* once a reader is configured, not zero: the check only publishes
  # it on the branch that could not exercise the reader. A rule keyed on `== 1` must be
  # silent then, or every estate with the credential set alarms forever.
  - name: a configured reader leaves the note absent and the alert silent
    interval: 1m
    input_series:
      - series: 'innotel_estate_check_last_status{check="scan_share"}'
        values: '1x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: EstateScanShareReaderUnproven
        exp_alerts: []
