# ==========================================================================
# promtool unit tests for estate-checks.yml
# ==========================================================================
# `EstateCheckAbsent` fires on a *missing* series, so it cannot be exercised by the
# checks themselves — a check that runs always publishes its series. These cases are
# the estate as the rule expects it, the same estate with one check's series removed,
# and an estate with the whole family gone.
#
# Every branch of `EstateCheckAbsent` is mirrored here, in the rule's own order. A
# branch added to the rule without a case here fires an unexpected alert and fails
# this test, which is how the drift that left seven checks unwatched in these cases
# (2026-11-02) is caught from now on.
#
# Run:  promtool test rules extensions/monitoring/prometheus/rules/tests/estate-checks.test.yml
# ==========================================================================
rule_files:
  - ../estate-checks.yml

evaluation_interval: 1m

tests:
  # Every check is reporting: nothing is absent, whatever the values are.
  - name: all checks reporting means no absent alert
    interval: 1m
    input_series:
      - series: 'innotel_estate_check_last_run_timestamp{check="container_address"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="container_limits"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="estate_inventory"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="address_latency"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="host_disk"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="alert_delivery"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="mail_auth"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="mail_relay"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="group_compose_freshness"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="authentik_privilege"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="sso_callback"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="dmarc_alignment"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="edge_vhost_targets"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="edge_vhost_pins"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="edge_sso_door"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="mount_stack"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="mail_traffic"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="npm_config_drift"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="stuck_processes"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="deploy_door"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="mail_sso"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="stalwart_oidc_cache"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="telno_legacy_import"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: EstateCheckAbsent
        exp_alerts: []

  # The estate-inventory check's textfile was never written (or was deleted): the family
  # has no series for it, and this is the rule that has to notice. The others must not be
  # dragged in with it.
  - name: a check with no series at all is absent
    interval: 1m
    input_series:
      - series: 'innotel_estate_check_last_run_timestamp{check="container_address"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="container_limits"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="address_latency"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="host_disk"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="alert_delivery"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="mail_auth"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="mail_relay"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="group_compose_freshness"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="authentik_privilege"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="sso_callback"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="dmarc_alignment"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="edge_vhost_targets"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="edge_vhost_pins"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="edge_sso_door"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="mount_stack"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="mail_traffic"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="npm_config_drift"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="stuck_processes"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="deploy_door"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="mail_sso"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="stalwart_oidc_cache"}'
        values: '0x60'
      - series: 'innotel_estate_check_last_run_timestamp{check="telno_legacy_import"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: EstateCheckAbsent
        exp_alerts:
          - exp_labels: {severity: critical, team: platform, check: estate_inventory}
            exp_annotations:
              summary: 'The estate_inventory check has never reported'
              description: 'No `innotel_estate_check_last_run_timestamp` series exists for the `estate_inventory` check — it has not run, or its textfile is not in the directory node-exporter reads. Every other rule here keys on a series that exists, so this is the one that catches the check itself being absent. Check the timer and `TEXTFILE_DIR` on the edge.'

  # None of the family reporting (the whole textfile directory gone) fires once per known
  # check, because the branches are independent: one alert per check, one label set each,
  # and a check added without a branch here would be the one silence the rule cannot name.
  - name: no check reporting fires once per known check
    interval: 1m
    input_series:
      - series: 'up{job="node"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: EstateCheckAbsent
        exp_alerts:
