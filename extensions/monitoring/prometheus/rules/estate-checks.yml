# ==========================================================================
# Estate-check alerts
# ==========================================================================
# Every host-level check publishes one metric family — `innotel_estate_check`, with a
# `check` label naming the check — so one rule set covers all of them and still says
# which one fired. The contract lives in `scripts/estate_check.py`; the checks are
# `scripts/check-container-addresses.py` (`container_address`),
# `check-container-limits.py` (`container_limits`), `check-estate-inventory.py`
# (`estate_inventory`), `check-address-latency.py` (`address_latency`),
# `check-host-disk.py` (`host_disk`), `check-alert-delivery.py` (`alert_delivery`),
# `check-mail-auth.py` (`mail_auth`), `check-mail-relay.py` (`mail_relay`),
# `check-group-compose-freshness.py` (`group_compose_freshness`) and
# `check-authentik-privilege.py` (`authentik_privilege`) — the one about who can
# administer the directory — and `check-sso-callbacks.py` (`sso_callback`), the one
# about a sign-in gate's answer fitting the proxy in front of it — and the edge's own
# two, `check-edge-vhost-targets.py` (`edge_vhost_targets`) and `check-edge-sso-door.py`
# (`edge_sso_door`), and the one that holds a pinned door to NPM's own row rather than to
# the file NPM regenerates from it, `check-edge-vhost-pins.py` (`edge_vhost_pins`), and
# `check-mount-stacks.py` (`mount_stack`) — run by
# `systemd/estate-checks.{service,timer}` on the Cerulean edge, which writes each into
# node-exporter's textfile directory.
#
# Why these are worth paging on: each check guards something the estate is reached by.
# An address is an interface (every A record and published port names one), a CPU cap
# is a fence that a declared-but-unenforced limit only pretends to be, the host and pool
# inventory is what stops a fourth host or a stray pool arriving unrecorded, and
# `address_latency` is both the proof that a dialled address is *lit* (not only correctly
# numbered) and the number that says the `i4` WiFi uplink's power save has come back
# rather than leaving the estate merely feeling slow. `host_disk` is the root filesystem
# headroom, watched because "i2 is the one to watch" was a note read by hand and a disk
# fills by arithmetic. `alert_delivery` is the receiver itself: it injects a probe alert
# through the estate's one Alertmanager and reads the mail server for its delivery, so a
# receiver that is configured-but-silent — the state it sat in for its whole life, past
# every `amtool check-config` — is a finding rather than an assumption. The 2026-10-01
# outage — `ontrak` renumbered `.21` → `.20` — stayed invisible until a person noticed a
# blank dashboard, which is the case all of this exists to close. `mail_auth` is the
# certificate under the mail: it reads the SPF, DKIM and DMARC records back from the zone
# the public sees for every domain the estate signs as, because Stalwart generates the
# keys but its automatic DNS publishing is refused by that zone, so a missing or rotated
# record is otherwise only visible as mail that quietly fails verification. `mail_relay`
# is the other half of the mail path — outbound rather than inbound authentication: the
# smarthost route, its reachability, an active DKIM signature per sending domain and a
# queue that drains, each of which has broken here without a symptom. (It arrived in this
# repo on 2026-10-09; it had been running on the edge with a literal password in a
# mode-0755 file and no rules, so a failure in it reached nobody.)
# `sso_callback` is the one that is about the proxy rather than about an app: a
# gated host's callback answers 502 when its session cookie is larger than the
# proxy's header buffer, which is a sign-in that fails *after* it succeeded and is
# invisible in the app's log because the app was never reached.
# `group_compose_freshness` is the one that is not about a host: the group composes are
# generated from the member repos and tracked, so a repo that moves on leaves the file a
# rebuild starts from behind — and CI only compares them when *this* repo changes, while
# the inputs live in the member repos. It takes both sides from the remote (~15 s of
# shallow clones), so the answer is about the branches, never about a working copy.
# `mail_traffic` is the one about volume rather than configuration: it reads Stalwart's
# own log for what actually moved (delivered, bounced, queued, authenticated, blocked)
# and publishes the counts the Grafana mail dashboard is built from — Stalwart v0.16 has
# no Prometheus endpoint, so without this there is no mail traffic to look at.
# `npm_config_drift` is the one about two copies of one fact: NPM's host list and the
# vhost files it generated. Deleting a host leaves the file serving (2026-10-30, 25 of
# them onto dead ports) and editing one does not rewrite it (a parked name kept its old
# port in the file), and neither is visible in a config diff or as a dead target.
# `edge_vhost_pins` is the one about *which copy is the authority*. NPM rewrites
# `proxy_host/NN.conf` from its row on its own schedule, so a hand-repaired file is right
# only until the next regeneration — 2026-11-09, the TV door, twice in one afternoon, the
# second time because only the file had been repaired. It holds a pinned door to the row
# as well as to the file, and it holds the names that must stay redirects: a name that
# gains an enabled proxy host is a retired name being served again rather than moved, and
# in that case *both* generated files still look correct.
# `mount_stack` is the one about a number rather than a verdict: 32 769 NFS mount entries
# accumulated under `/srv/onyx-pool` on 2026-10-29, each mounted on top of a stale handle
# after ganesha restarted, until every `df` on i3 blocked and `admin.distro.innotel.us`
# answered nothing. A second entry for one target is the early warning, and nothing else in
# the estate reports it; `stale` is the outage, and the probe is bounded because an
# unbounded one joins the queue it is looking for.
# `atheniq_doors` is the one about a door that fails by *opening*: the classroom has to answer
# a learner's link with a redirect to authentik, the right client and the callback it was
# registered under, and a name that answers 200 instead reads as healthy in every other
# check. It also holds the superseded `classroom.` name to two states (gated, or moved to the
# classroom) and publishes the move as a note, so the retirement is visible on the page
# rather than remembered (docs/atheniq-classroom-name.md).
#
# Every rule but one keys on a series, so it can only speak about a check whose
# textfile reached node-exporter. `EstateCheckAbsent` is the exception: it fires when a
# selector matches nothing at all, which is how a check that was never deployed or whose
# textfile was deleted is noticed. It carries one `absent(...)` branch per check, kept in
# step with the checks by `scripts/tests/test_estate_alert_rules.py` — add a check, add a
# branch, or that check is silent in exactly the way 2026-10-01 was.
#
# The metric contract (written by `estate_check.write_prom`), per `check`:
#   innotel_estate_check_last_status            1 ran and found nothing, 0 otherwise
#   innotel_estate_check_last_run_timestamp     unix seconds, every run
#   innotel_estate_check_last_success_timestamp unix seconds, advanced only on a clean run
#   innotel_estate_check_failures               things that do not hold (absent if the check could not run)
#   innotel_estate_check_warnings               things worth a look
# ==========================================================================
groups:
  - name: innotel-estate-checks
    rules:
      # The alert that would have caught 2026-10-01 on its own: not a check that ran
      # and found nothing, but one that never reported at all. Every rule below keys on
      # a series, so it can only speak about a check whose textfile reached
      # node-exporter; a check that was never deployed, whose textfile was deleted, or
      # whose `TEXTFILE_DIR` is wrong has no series, and the rules below stay silent
      # forever — the failure is in the shape of a check, which is what the outage looked
      # like. `absent()` is the one thing that fires on a selector matching *nothing*;
      # one branch per known check keeps the `check` label so the alert still names which
      # invariant is unwatched. A check added without a branch here is that same silence,
      # which `scripts/tests/test_estate_alert_rules.py` is there to catch.
      - alert: EstateCheckAbsent
        expr: |
          label_replace(absent(innotel_estate_check_last_run_timestamp{check="container_address"}), "check", "container_address", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="container_limits"}), "check", "container_limits", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="probe_audit"}), "check", "probe_audit", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="sso_ping"}), "check", "sso_ping", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="estate_inventory"}), "check", "estate_inventory", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="address_latency"}), "check", "address_latency", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="host_disk"}), "check", "host_disk", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="alert_delivery"}), "check", "alert_delivery", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="mail_auth"}), "check", "mail_auth", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="mail_relay"}), "check", "mail_relay", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="group_compose_freshness"}), "check", "group_compose_freshness", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="authentik_privilege"}), "check", "authentik_privilege", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="sso_callback"}), "check", "sso_callback", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="dmarc_alignment"}), "check", "dmarc_alignment", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="edge_vhost_targets"}), "check", "edge_vhost_targets", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="edge_vhost_pins"}), "check", "edge_vhost_pins", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="edge_sso_door"}), "check", "edge_sso_door", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="mount_stack"}), "check", "mount_stack", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="mail_traffic"}), "check", "mail_traffic", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="npm_config_drift"}), "check", "npm_config_drift", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="stuck_processes"}), "check", "stuck_processes", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="deploy_door"}), "check", "deploy_door", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="mail_sso"}), "check", "mail_sso", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="stalwart_oidc_cache"}), "check", "stalwart_oidc_cache", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="mail_identities"}), "check", "mail_identities", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="vault_mount"}), "check", "vault_mount", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="vault_disk"}), "check", "vault_disk", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="orion_signin"}), "check", "orion_signin", "check", ".*")
          # Since 2026-09-18, and never named here until the test that reads the scripts on disk
          # was written: this check has published into the family since the media doors were
          # split into `media` and `iptv`, so a textfile that stopped arriving alerted on
          # nothing — the exact silence this rule exists for, one branch short.
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="media_doors"}), "check", "media_doors", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="host_zombies"}), "check", "host_zombies", "check", ".*")
          # What boots (2026-11-17). A reboot is the one moment this check's subject stops
          # being invisible, so a textfile that stopped arriving must not be the thing that
          # hides it.
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="container_autostart"}), "check", "container_autostart", "check", ".*")
          # The household's read-only door onto the scanner's folder (2026-11-19). A textfile
          # that stopped arriving here would leave `read only`/`write list` asserted by
          # nothing, and the only symptom of that rule widening is a file somebody did not
          # mean to overwrite.
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="scan_share"}), "check", "scan_share", "check", ".*")
          # The mail container's own preflight, published (2026-11-14). `stalwart_oidc_cache`
          # above asks whether the local copy is current; this asks the eleven facts step 1
          # of docs/mail-discovery-canonical.md asks a person — the units, the leaf's SAN
          # against the upstream the proxy actually uses, the anchor's expiry, the DNAT
          # rules, whether the provider answers from inside the container, both users' read
          # access and the bearer probe. Every half-done subset of that apply fails
          # identically, so a check that stops reporting must not be the thing that hides it.
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="stalwart_oidc_preflight"}), "check", "stalwart_oidc_preflight", "check", ".*")
          # The classroom's gate (2026-11-14). Unlike everything above, the thing this one
          # asserts is a *redirect*: a 200 is the failure, and a door that silently stopped
          # being gated would look better in every other view of the estate, not worse.
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="atheniq_doors"}), "check", "atheniq_doors", "check", ".*")
            or label_replace(absent(innotel_estate_check_last_run_timestamp{check="installed_checks"}), "check", "installed_checks", "check", ".*")
            or label_replace(absent(innotel_estate_check_last_run_timestamp{check="unit_drift"}), "check", "unit_drift", "check", ".*")
          # The age of the vault's credentials (2026-11-17): every other check
          # asks whether a credential works, and one that is never rotated works
          # exactly like one rotated yesterday.
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="credential_age"}), "check", "credential_age", "check", ".*")
          # And the check that reads history instead of the moment: its own series
          # is the one place a flapping check is visible.
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="estate_flaps"}), "check", "estate_flaps", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="retired_instances"}), "check", "retired_instances", "check", ".*")
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="sso_redirects"}), "check", "sso_redirects", "check", ".*")
          # The media apps a request crosses (2026-11-17). Every door in front of a
          # request answered while the app behind it was dead: Radarr's config had been
          # truncated by an OOM kill and its container still read Up. A check that stops
          # reporting must not be the thing that hides that.
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="media_apps"}), "check", "media_apps", "check", ".*")
          # The renewal itself (2026-11-17). It is the one check that writes: the
          # period on the token `check-credential-age` reads is what runs out, and an
          # expiry looks exactly like a renewal that was never attempted.
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="vault_token_renewal"}), "check", "vault_token_renewal", "check", ".*")
          # Who answers the name (2026-11-20). `next.atheniq.courses` answered from a
          # container, the browser reached the catalog over plain HTTP, and the page said
          # "An unexpected error occurred" while every other check was green. A textfile
          # that stopped arriving here would be that same silence one layer up.
          or label_replace(absent(innotel_estate_check_last_run_timestamp{check="edge_front_door"}), "check", "edge_front_door", "check", ".*")
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'The {{ $labels.check }} check has never reported'
          description: >-
            No `innotel_estate_check_last_run_timestamp` series exists for the
            `{{ $labels.check }}` check — it has not run, or its textfile is not in the
            directory node-exporter reads. Every other rule here keys on a series that
            exists, so this is the one that catches the check itself being absent. Check
            the timer and `TEXTFILE_DIR` on the edge.

      - alert: EstateCheckFailing
        expr: innotel_estate_check_failures > 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'The {{ $labels.check }} check is failing'
          description: >-
            {{ $value }} finding(s) in the `{{ $labels.check }}` estate check. Each check
            names the thing that broke and what is dialled there; run it by hand on the
            edge for the message, then fix the estate rather than the check. See
            docs/container-placement.md.

      # A run that could not reach a host (exit 2) is not a pass — it is the state the
      # 2026-10-01 outage sat in. `unless` keeps this quiet when the run happened and
      # merely found something (that is EstateCheckFailing).
      - alert: EstateCheckCouldNotRun
        expr: innotel_estate_check_last_status == 0 unless innotel_estate_check_failures > 0
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'The {{ $labels.check }} check cannot reach a host'
          description: >-
            The `{{ $labels.check }}` check exited 2 — a host it needs was unreachable —
            so nothing is watching that invariant right now. Check the timer and the ssh
            path from the edge.

      # "A whole day": the checks run every 30 minutes, so a success more than 24h old
      # means every run since has either failed or never happened. 24h is the shortest
      # window that cannot be tripped by a normal quiet night.
      - alert: EstateCheckStale
        expr: (time() - innotel_estate_check_last_success_timestamp) > 24 * 60 * 60
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'No clean {{ $labels.check }} run in 24 hours'
          description: >-
            The last `{{ $labels.check }}` run that found nothing wrong was
            {{ $value | humanizeDuration }} ago. Either the timer is gone or every run
            since has failed; both mean that invariant is unwatched.

      # A check is only as fresh as the timer that runs it. `EstateCheckAbsent` speaks
      # about a series that is *gone*, and `EstateCheckStale` waits a whole day for a
      # clean run, so a textfile that is still scraped but has not moved since yesterday
      # satisfies both while asserting nothing — which is the shape a stopped timer takes,
      # and the reason the jobs that retry on their own (the mailbox mirror among them,
      # docs/estate-alerts-ntfy.md) publish a series instead of an `OnFailure=` message:
      # a frozen textfile is the only trace a stopped retry leaves. Two hours is four
      # missed runs of the 30-minute timer, so a slow host cannot trip it.
      - alert: EstateCheckNotRunning
        expr: (time() - innotel_estate_check_last_run_timestamp) > 2 * 60 * 60
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'The {{ $labels.check }} check has not run in two hours'
          description: >-
            The last `{{ $labels.check }}` run reported {{ $value | humanizeDuration }} ago,
            so its textfile is still being scraped but has not moved since. The timer that
            runs it is stopped, or every run since died before writing: nothing is watching
            this invariant now, whatever the last reading said. Check
            `systemctl list-timers estate-checks.timer` and the unit's journal on the edge.

      - alert: EstateCheckNotPinned
        expr: innotel_estate_check_warnings > 0
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'The {{ $labels.check }} check has warnings'
          description: >-
            {{ $value }} warning(s) in the `{{ $labels.check }}` check — drift that is not
            yet a failure (a container still on DHCP, a cap above the host, a pool that
            has gone, an address answering in hundreds of milliseconds, a root filesystem
            past 80 %). Worth a look before it becomes one. For `address_latency`, see
            systemd/wifi-powersave-off.service; for `host_disk`, reclaim before a write
            fails.

      # The one rule here about a *note* rather than a verdict, and it exists because a
      # correct note can still be the wrong resting place. `scan_share` publishes
      # `reader_unproven` while `SCAN_SHARE_READ_USER`/`SCAN_SHARE_READ_PASSWORD` are unset
      # (2026-11-19): the writer and the stanza are still exercised, so the check reads
      # green, and nothing in it can mint the credential a refusal needs. The stanza rules
      # catch `read only` or `write list` being dropped; they cannot catch *whether a
      # reader is refused at all* having stopped being asked. Six hours is twelve runs of
      # the 30-minute timer — long enough for a credential rotation, short enough that the
      # half nobody is exercising cannot be forgotten for a season.
      - alert: EstateScanShareReaderUnproven
        expr: innotel_estate_check_note{check="scan_share",code="reader_unproven"} == 1
        for: 6h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'The Scans share has no configured reader, so its refusal is unproven'
          description: >-
            `check-scan-share.py` has published `reader_unproven` for six hours: no
            `SCAN_SHARE_READ_USER`/`SCAN_SHARE_READ_PASSWORD` is set in
            `/etc/innotel/estate-checks.env`, so the half of the rule that keeps the
            household from overwriting scans is not being exercised — the writer and the
            stanza still pass, which is why the check reads green while this is true. Set
            both to an account in `[Scans]`'s `valid users` that is not in its `write list`
            (`scan-reader`, added for exactly this), and the note disappears.

  # The media estate's apps, and the solver behind them (2026-11-17). These key on the
  # series `check-media-apps.py` publishes rather than on the shared family, because the
  # state they name is not "a check found something" — it is one specific file being zero
  # bytes, or one container killing its own Chromium while every door in front of it
  # answers 200. `EstateCheckFailing` would report that as one anonymous finding in
  # `media_apps`; these name the app.
  - name: innotel-media-apps
    rules:
      - alert: EstateMediaAppConfigEmpty
        expr: innotel_estate_media_app_config_bytes{app=~".+"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: '{{ $labels.app }} has a zero-byte config file'
          description: >-
            The app a request crosses has a settings file with no bytes in it — the shape an
            OOM kill leaves when it lands mid-write, and the app then refuses to start after
            its next restart while `docker ps` still prints Up for it. Restore it from that
            app's own `Backups/scheduled` archive; **do not delete it**, because the app
            regenerates one with a new API key and the request UI in front of it keeps
            pointing at the old one.

      - alert: EstateMediaAppConfigUnreadable
        expr: innotel_estate_media_app_config_bytes{app=~".+"} < 0
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '{{ $labels.app }} has no readable config file'
          description: >-
            The config probe could not read the app's settings file at all: a path that is
            not there, or a container that cannot `stat` it. That is a different repair from
            a truncated file, which is why it is a separate alert rather than the same one
            with a different message.

      - alert: EstateMediaAppSolverKillingItself
        expr: increase(innotel_estate_media_app_solver_oom_kills{app="flaresolverr"}[1h]) > 0
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'flaresolverr is being OOM-killed inside its own cap'
          description: >-
            The solver `prowlarr` sends indexer challenges to was killed
            {{ $value | humanize }} time(s) in the last hour inside its own cgroup. Every
            solve that dies this way is an indexer `prowlarr` cannot reach, and no door in
            front of the media estate shows it: the app reads `running` and its page loads.
            Size the cap to measured use plus headroom (`mem_limit: 3g` since 2026-11-17) and
            keep `shm_size: 1g` — the 64 MB `/dev/shm` is what started this.

  # A healthcheck whose command the image does not ship is invisible from the
  # outside: docker reports the container unhealthy, or the probe simply never
  # passes, and nothing distinguishes that from a service that is down. On
  # 2026-11-21 Termix 26.11.3 dropped wget and both its compose healthcheck and
  # its cold-start gate stopped working; visitors got 503 and no rule fired.
  # `probe_audit` runs each container's own healthcheck inside the container and
  # reports `missing:<cmd>` separately, which is the drift this catches.
  - name: innotel-probe-audit
    rules:
      - alert: EstateProbeCannotRun
        expr: innotel_estate_check_probe_audit_ok{probe_state=~"missing:.*|fail"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "healthcheck probe broken on {{ $labels.host }}: {{ $labels.container }} ({{ $labels.probe_state }})"
          description: >-
            The container's own healthcheck does not pass when run inside the
            container ({{ $labels.probe_state }}). `missing:` means the image no
            longer ships the command the probe calls - the release changed the
            base image, and the probe has to be rewritten in terms of something
            the image does have (see docs/terminal-alerting.md for the wget
            case). Run `probe-audit.sh` on the host for the whole table.
