# Loads every dashboard JSON in /var/lib/grafana/dashboards (mounted from
# ./grafana/dashboards). Provisioned dashboards are read-only in the UI: they
# are versioned in this repo, not clicked into existence.
apiVersion: 1

providers:
  - name: innotel
    orgId: 1
    folder: Innotel
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
