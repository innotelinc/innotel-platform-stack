# ══════════════════════════════════════════════════════════════════════════════
# Extension: monitoring — STANDALONE per-host variant (no mesh, no Consul)
# ══════════════════════════════════════════════════════════════════════════════
# `docker-compose.ext.yml` in this directory is the mesh-attached version: it
# registers with Consul and joins `innotel-mesh-net`, so it only comes up on a
# host that has joined the mesh. This file is the same idea with none of that
# wiring, for the hosts that run a product stack but no mesh — `.50` (Olympus),
# `.56` (Monarch) and `.71` (Cerulean, where it also watches the identity dump
# through TEXTFILE_DIR).
#
# It is deliberately the small half of what Capstone runs: host-level metrics
# (CPU, memory, disk, network) plus a metrics store and a dashboard. There is
# no OTLP collector here because those stacks do not emit OTel yet; add the
# `otel-collector` service from `2-voice/capstone/docker-compose.yml` (and point
# the app's OTEL_EXPORTER_OTLP_ENDPOINT at it) on the day one does.
#
# Posture: every port is loopback-only, matching the rest of the platform. Reach
# the UI over an SSH tunnel:
#
#   ssh -L 3301:127.0.0.1:3301 root@<host>      # then http://localhost:3301
#
# Deploy on a host:
#
#   cd /usr/src/projects/complete/ips/extensions/monitoring
#   GRAFANA_PASSWORD=$(openssl rand -hex 16) docker compose -p innotel-metrics \
#     -f docker-compose.host.yml --env-file .env.host up -d
#
# Check the host ports are free first — `.56` already runs sabnzbd on
# 127.0.0.1:9090, so it sets PROMETHEUS_PORT=9095 instead.
#
# Copy `.env.host.example` to `.env.host` first; it is gitignored.
#
# On `.71` the same stack carries the estate's backup alerts: set
# TEXTFILE_DIR=/root/cerulean-backup/authentik so node-exporter's textfile
# collector picks up the dump's `status.prom`, and `./prometheus/rules/`
# (mounted by the service below) is what turns it into alerts.
#
# Alerts do not stop at the host they were evaluated on: `prometheus.host.yml`
# carries the `alerting:` section that sends them to the estate's one Alertmanager
# (`192.168.1.44:9093`), which is what lets the rules reach anybody at all. Before
# 2026-10-15 they did not — this stack evaluated its rules, showed them in its own
# UI and delivered nothing — so a host that runs it with an empty or wrong receiver
# is that same silence, and nothing on the host looks wrong.

services:
  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.9.1}
    container_name: metrics-node-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    # CPU ceilings on the observers, added 2026-10-24 with the rest of the host's
    # containers: Grafana was measured at 11.8 % of a two-core box while idle-ish, and
    # on a host this small an uncapped observer competes with what it observes. Each is
    # a ceiling, not a reservation — nothing is lost when the host is quiet.
    cpus: 0.25
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # Textfile collector: any *.prom a scheduled job writes into TEXTFILE_DIR
      # becomes scrapeable metrics, which is how a backup job's status file
      # reaches the rules in ./prometheus/rules/ without either side knowing
      # about the other. `--path.rootfs` does NOT prefix this directory (measured
      # against this image, v1.9.1), so the mount below is what locates it.
      - "--collector.textfile.directory=/var/lib/node_exporter/textfile"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
      # Defaults to an empty directory on a host that publishes no status file:
      # the collector then reports no series, and the rules that key on those
      # series stay quiet instead of firing about a job this host does not run.
      - "${TEXTFILE_DIR:-/var/lib/node_exporter/textfile}:/var/lib/node_exporter/textfile:ro"
    networks: [metrics-net]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.3}
    container_name: metrics-prometheus
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-1g}
    memswap_limit: ${PROMETHEUS_MEM_LIMIT:-1g}
    cpus: 0.5
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      # Host port is configurable because the obvious one can be taken: on `.56`
      # the *arr stack publishes sabnzbd on 127.0.0.1:9090 already, so that host
      # sets PROMETHEUS_PORT=9095.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"   # loopback only
    volumes:
      - ./prometheus/prometheus.host.yml:/etc/prometheus/prometheus.yml:ro
      # Every file here is loaded by every host that runs this stack, and one of
      # them does not tolerate a host that takes no measurements: `EstateCheckAbsent`
      # in `estate-checks.yml` fires on a series that is *missing*, which is exactly
      # what a host that does not run the checks looks like — they need
      # `systemd/estate-checks.timer` and the `TEXTFILE_DIR` it writes to. Mounting
      # this directory there means nine criticals about invariants that host was
      # never asked to keep, and now that the `alerting:` section above works they
      # are mailed. `backup.yml` is safe anywhere: it keys on the dump's series being
      # *present* (it is why one rules directory serves every host). Monarch's
      # running Prometheus has no such mount today; settle this before recreating
      # this stack on a host that runs no checks — see docs/container-placement.md
      # §Open items.
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - metrics_prometheus_data:/prometheus
    depends_on:
      - node-exporter
    networks: [metrics-net]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.2}
    container_name: metrics-grafana
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    memswap_limit: ${GRAFANA_MEM_LIMIT:-512m}
    cpus: 0.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3301}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3301}:3000"   # loopback only; use an SSH tunnel
    volumes:
      - metrics_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [metrics-net]

volumes:
  metrics_prometheus_data:
  metrics_grafana_data:

networks:
  metrics-net:
    name: innotel-metrics
