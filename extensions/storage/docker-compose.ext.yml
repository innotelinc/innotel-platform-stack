# ══════════════════════════════════════════════════════════════════════════════
# Extension: minio-storage — S3 object storage for any group
# ══════════════════════════════════════════════════════════════════════════════

services:
  minio:
    image: minio/minio:latest
    container_name: ext-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - innotel-mesh-net

  consul-reg-minio:
    image: curlimages/curl:latest
    container_name: ext-consul-reg-minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        curl -s --max-time 5 -X PUT http://${REGISTRY_ADDR:-mesh-consul:8500}/v1/agent/service/register \
          -H 'Content-Type: application/json' \
          -d '{
            "Name": "minio",
            "Address": "${MESH_SERVER_IP}",
            "Port": ${MINIO_PORT:-9000},
            "Tags": ["storage","s3","object-store"],
            "Check": {
              "TCP": "${MESH_SERVER_IP}:${MINIO_PORT:-9000}",
              "Interval": "15s",
              "Timeout": "5s"
            }
          }'
        echo "[storage] Registered minio at ${MESH_SERVER_IP}:${MINIO_PORT:-9000}"
    networks:
      - default
      - innotel-mesh-net
    depends_on:
      - minio

volumes:
  minio-data:

networks:
  default:
    name: ext-storage-net
  innotel-mesh-net:
    external: true