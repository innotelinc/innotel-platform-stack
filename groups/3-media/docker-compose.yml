# ══════════════════════════════════════════════════════════════════════════════
# Group 3 — MEDIA
# Monarch — Jellyfin streaming, *arr automation, NPM edge (80/443)
# PLUTUS (VideoOps — AI shopping channel: Convex + ffmpeg + static web)
# + joins the shared WireGuard mesh
# ══════════════════════════════════════════════════════════════════════════════
# RAM: ~10 GiB | Ports: 80, 443, 81, 8096, 9696, 8989, 7878, 3000, 3210, 3211, 6791, 51820
# ══════════════════════════════════════════════════════════════════════════════

name: innotel-group3

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ═══ NPM Edge (this server's TLS termination + proxy) ════════════════════
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: g3-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - default
      - innotel-mesh-net

  # ═══ Jellyfin (streaming core) ═════════════════════════════════════════════
  jellyfin:
    <<: *common
    image: ghcr.io/hotio/jellyfin:latest
    container_name: g3-jellyfin
    ports:
      - "${MONARCH_JELLYFIN_PORT:-8096}:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    networks:
      - default
      - innotel-mesh-net

  # ═══ Jellyseerr (requests) ════════════════════════════════════════════════
  jellyseerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest
    container_name: g3-jellyseerr
    ports:
      - "5055:5055"
    environment:
      - TZ=UTC
    volumes:
      - jellyseerr-config:/config
    networks:
      - default
      - innotel-mesh-net

  # ═══ *arr Automation ═══════════════════════════════════════════════════════
  sonarr:
    <<: *common
    image: ghcr.io/hotio/sonarr:latest
    container_name: g3-sonarr
    ports:
      - "${MONARCH_SONARR_PORT:-8989}:8989"
    volumes:
      - sonarr-config:/config
      - /mnt/media:/mnt/media
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default
      - innotel-mesh-net

  radarr:
    <<: *common
    image: ghcr.io/hotio/radarr:latest
    container_name: g3-radarr
    ports:
      - "${MONARCH_RADARR_PORT:-7878}:7878"
    volumes:
      - radarr-config:/config
      - /mnt/media:/mnt/media
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default
      - innotel-mesh-net

  lidarr:
    <<: *common
    image: ghcr.io/hotio/lidarr:latest
    container_name: g3-lidarr
    ports:
      - "8686:8686"
    volumes:
      - lidarr-config:/config
      - /mnt/media:/mnt/media
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default

  prowlarr:
    <<: *common
    image: ghcr.io/hotio/prowlarr:latest
    container_name: g3-prowlarr
    ports:
      - "${MONARCH_PROWLARR_PORT:-9696}:9696"
    volumes:
      - prowlarr-config:/config
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default

  # ═══ Download Clients ═════════════════════════════════════════════════════
  qbittorrent:
    <<: *common
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: g3-qbittorrent
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent-config:/config
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default

  sabnzbd:
    <<: *common
    image: ghcr.io/hotio/sabnzbd:latest
    container_name: g3-sabnzbd
    ports:
      - "8085:8085"
    volumes:
      - sabnzbd-config:/config
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default

  # ═══ Supporting Services ═══════════════════════════════════════════════════
  flaresolverr:
    <<: *common
    image: ghcr.io/hotio/flaresolverr:latest
    container_name: g3-flaresolverr
    ports:
      - "8191:8191"
    networks:
      - default

  dispatcharr:
    <<: *common
    image: ghcr.io/hotio/dispatcharr:latest
    container_name: g3-dispatcharr
    ports:
      - "9292:9292"
    networks:
      - default

  nextpvr:
    <<: *common
    image: ghcr.io/hotio/nextpvr:latest
    container_name: g3-nextpvr
    ports:
      - "8866:8866"
    volumes:
      - nextpvr-config:/config
    networks:
      - default

  tvheadend:
    <<: *common
    image: ghcr.io/hotio/tvheadend:latest
    container_name: g3-tvheadend
    ports:
      - "9981:9981"
      - "9982:9982/udp"
    volumes:
      - tvheadend-config:/config
    networks:
      - default

  watchtower:
    <<: *common
    image: containrrr/watchtower:latest
    container_name: g3-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --schedule "0 0 4 * * *"
    networks:
      - default

  # ═══ Monarch Intelligence ═════════════════════════════════════════════════
  monarch-api:
    build:
      context: ../../../monarch-media-platform
    container_name: g3-monarch-api
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      JELLYFIN_URL: http://g3-jellyfin:8096
      OMNIROUTE_URL: http://${OMNIRROUTE_MESH_ADDR:-10.10.2.1}:${OMNIROUTE_PORT:-20128}
    depends_on:
      - jellyfin
    networks:
      - default
      - innotel-mesh-net

  monarch-health:
    <<: *common
    image: ghcr.io/hotio/jellyfin:latest
    container_name: g3-monarch-health
    profiles: ["health"]
    entrypoint: ["curl", "-sf", "http://jellyfin:8096/health"]
    networks:
      - default

  # ═══ PLUTUS (VideoOps — self-hosted AI shopping channel) ══════════════════
  # Mirrors PLUTUS's own docker-compose.yml: a self-hosted Convex backend
  # (custom image carrying ffmpeg) on 3210 with its HTTP-actions proxy on 3211,
  # the Convex dashboard on 6791, and the Next.js static export served by
  # nginx on 3000. Product hosts (plutus.innotel.us) are provisioned by
  # Cerulean + NPM Edge — not here.
  #
  # Prerequisites in the sibling ../../../plutus checkout
  # (`./stack.sh download plutus` clones it):
  #   * out/   the static export, built once in the checkout with `bun run build`
  #   * the Convex admin key: `docker compose exec plutus-backend ./generate_admin_key.sh`
  # Further Convex env (S3, INSTANCE_SECRET, Authentik SSO, PUBLIC_URL) is set
  # in the checkout with `npx convex env set …`, per PLUTUS's .env.example —
  # including OMNIROUTE_BASE_URL, which points the video pipeline at the shared
  # OmniRoute gateway on the mesh.

  plutus-backend:
    <<: *common
    build:
      context: ../../../plutus
      dockerfile: deploy/backend.Dockerfile
    image: plutus-backend:local
    container_name: g3-plutus-backend
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PLUTUS_CONVEX_PORT:-3210}:3210"        # Convex API
      - "${PLUTUS_SITE_PROXY_PORT:-3211}:3211"    # HTTP actions / file serving
    volumes:
      - plutus-data:/convex/data
      - plutus-fallback-clips:/fallback-clips
    environment:
      CONVEX_CLOUD_ORIGIN: ${PLUTUS_CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PLUTUS_CONVEX_PORT:-3210}}
      CONVEX_SITE_ORIGIN: ${PLUTUS_CONVEX_SITE_ORIGIN:-http://127.0.0.1:${PLUTUS_SITE_PROXY_PORT:-3211}}
      ADMIN_SECRET: ${PLUTUS_ADMIN_SECRET:-plutus-admin-secret-change-in-production}
      DO_NOT_REQUIRE_SSL: "true"
      DISABLE_BEACON: "true"
      DISABLE_METRICS_ENDPOINT: "true"
      RUST_LOG: ${PLUTUS_RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - default
      - innotel-mesh-net

  plutus-dashboard:
    <<: *common
    image: ghcr.io/get-convex/convex-dashboard:latest
    container_name: g3-plutus-dashboard
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PLUTUS_DASHBOARD_PORT:-6791}:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${PLUTUS_CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PLUTUS_CONVEX_PORT:-3210}}
    depends_on:
      plutus-backend:
        condition: service_healthy
    networks:
      - default
      - innotel-mesh-net

  plutus-web:
    <<: *common
    image: nginx:1.27-alpine
    container_name: g3-plutus-web
    ports:
      - "${PLUTUS_WEB_PORT:-3000}:80"
    volumes:
      - ../../../plutus/out:/usr/share/nginx/html:ro
      - ../../../plutus/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - plutus-fallback-clips:/fallback-clips:ro
    depends_on:
      plutus-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - innotel-mesh-net

  # ── Consul registration ────────────────────────────────────────────────────
  consul-reg-g3:
    image: curlimages/curl:latest
    container_name: g3-consul-reg
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 15
        for svc in \
          "jellyfin|${MESH_SERVER_IP:-10.10.3.1}|8096|media,streaming" \
          "jellyseerr|${MESH_SERVER_IP:-10.10.3.1}|5055|media,requests" \
          "sonarr|${MESH_SERVER_IP:-10.10.3.1}|8989|media,automation" \
          "radarr|${MESH_SERVER_IP:-10.10.3.1}|7878|media,automation" \
          "prowlarr|${MESH_SERVER_IP:-10.10.3.1}|9696|media,indexers" \
          "qbittorrent|${MESH_SERVER_IP:-10.10.3.1}|8080|media,downloads" \
          "npm|${MESH_SERVER_IP:-10.10.3.1}|81|edge,proxy,tls" \
          "monarch-api|${MESH_SERVER_IP:-10.10.3.1}|3100|media,intelligence" \
          "plutus-backend|${MESH_SERVER_IP:-10.10.3.1}|3210|video,ai,plutus" \
          "plutus-web|${MESH_SERVER_IP:-10.10.3.1}|3000|video,web,plutus"; do
          NAME=$(echo "$$svc" | cut -d'|' -f1)
          ADDR=$(echo "$$svc" | cut -d'|' -f2)
          PORT=$(echo "$$svc" | cut -d'|' -f3)
          TAGS=$(echo "$$svc" | cut -d'|' -f4)
          curl -s -X PUT http://${REGISTRY_ADDR:-mesh-consul:8500}/v1/agent/service/register \
            -H 'Content-Type: application/json' \
            -d "{\"Name\":\"$$NAME\",\"Address\":\"$$ADDR\",\"Port\":$$PORT,\"Tags\":[\"$${TAGS// /\", \"}\"]}" \
            >/dev/null
          echo "[g3] Registered $$NAME at $$ADDR:$$PORT"
        done
    networks:
      - default
      - innotel-mesh-net

volumes:
  npm-data:
  npm-letsencrypt:
  jellyfin-config:
  jellyfin-cache:
  jellyseerr-config:
  sonarr-config:
  radarr-config:
  lidarr-config:
  prowlarr-config:
  qbittorrent-config:
  sabnzbd-config:
  nextpvr-config:
  tvheadend-config:
  plutus-data:
  plutus-fallback-clips:

networks:
  default:
    name: g3-net
  innotel-mesh-net:
    external: true
