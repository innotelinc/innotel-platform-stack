# ══════════════════════════════════════════════════════════════════════════════
# Group 3 — MEDIA
# Monarch — Jellyfin streaming, *arr automation, NPM edge (80/443)
# + WireGuard mesh node
# ══════════════════════════════════════════════════════════════════════════════
# RAM: ~8 GiB | Ports: 80, 443, 81, 8096, 9696, 8989, 7878, 51820
# ══════════════════════════════════════════════════════════════════════════════

name: innotel-group3

include:
  - ../../mesh/docker-compose.mesh.yml

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ═══ NPM Edge (this server's TLS termination + proxy) ════════════════════
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: g3-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - default
      - innotel-mesh-net

  # ═══ Jellyfin (streaming core) ═════════════════════════════════════════════
  jellyfin:
    <<: *common
    image: ghcr.io/hotio/jellyfin:latest
    container_name: g3-jellyfin
    ports:
      - "${MONARCH_JELLYFIN_PORT:-8096}:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    networks:
      - default
      - innotel-mesh-net

  # ═══ Jellyseerr (requests) ════════════════════════════════════════════════
  jellyseerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest
    container_name: g3-jellyseerr
    ports:
      - "5055:5055"
    environment:
      - TZ=UTC
    volumes:
      - jellyseerr-config:/config
    networks:
      - default
      - innotel-mesh-net

  # ═══ *arr Automation ═══════════════════════════════════════════════════════
  sonarr:
    <<: *common
    image: ghcr.io/hotio/sonarr:latest
    container_name: g3-sonarr
    ports:
      - "${MONARCH_SONARR_PORT:-8989}:8989"
    volumes:
      - sonarr-config:/config
      - /mnt/media:/mnt/media
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default
      - innotel-mesh-net

  radarr:
    <<: *common
    image: ghcr.io/hotio/radarr:latest
    container_name: g3-radarr
    ports:
      - "${MONARCH_RADARR_PORT:-7878}:7878"
    volumes:
      - radarr-config:/config
      - /mnt/media:/mnt/media
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default
      - innotel-mesh-net

  lidarr:
    <<: *common
    image: ghcr.io/hotio/lidarr:latest
    container_name: g3-lidarr
    ports:
      - "8686:8686"
    volumes:
      - lidarr-config:/config
      - /mnt/media:/mnt/media
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default

  prowlarr:
    <<: *common
    image: ghcr.io/hotio/prowlarr:latest
    container_name: g3-prowlarr
    ports:
      - "${MONARCH_PROWLARR_PORT:-9696}:9696"
    volumes:
      - prowlarr-config:/config
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default

  # ═══ Download Clients ═════════════════════════════════════════════════════
  qbittorrent:
    <<: *common
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: g3-qbittorrent
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent-config:/config
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default

  sabnzbd:
    <<: *common
    image: ghcr.io/hotio/sabnzbd:latest
    container_name: g3-sabnzbd
    ports:
      - "8085:8085"
    volumes:
      - sabnzbd-config:/config
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - default

  # ═══ Supporting Services ═══════════════════════════════════════════════════
  flaresolverr:
    <<: *common
    image: ghcr.io/hotio/flaresolverr:latest
    container_name: g3-flaresolverr
    ports:
      - "8191:8191"
    networks:
      - default

  dispatcharr:
    <<: *common
    image: ghcr.io/hotio/dispatcharr:latest
    container_name: g3-dispatcharr
    ports:
      - "9292:9292"
    networks:
      - default

  nextpvr:
    <<: *common
    image: ghcr.io/hotio/nextpvr:latest
    container_name: g3-nextpvr
    ports:
      - "8866:8866"
    volumes:
      - nextpvr-config:/config
    networks:
      - default

  tvheadend:
    <<: *common
    image: ghcr.io/hotio/tvheadend:latest
    container_name: g3-tvheadend
    ports:
      - "9981:9981"
      - "9982:9982/udp"
    volumes:
      - tvheadend-config:/config
    networks:
      - default

  watchtower:
    <<: *common
    image: containrrr/watchtower:latest
    container_name: g3-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --schedule "0 0 4 * * *"
    networks:
      - default

  # ═══ Monarch Intelligence ═════════════════════════════════════════════════
  monarch-api:
    build:
      context: ../../monarch-media-platform
    container_name: g3-monarch-api
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      JELLYFIN_URL: http://g3-jellyfin:8096
      OMNIROUTE_URL: http://${OMNIRROUTE_MESH_ADDR:-10.10.2.1}:${OMNIROUTE_PORT:-20128}
    depends_on:
      - jellyfin
    networks:
      - default
      - innotel-mesh-net

  monarch-health:
    <<: *common
    image: ghcr.io/hotio/jellyfin:latest
    container_name: g3-monarch-health
    profiles: ["health"]
    entrypoint: ["curl", "-sf", "http://jellyfin:8096/health"]
    networks:
      - default

  # ── Consul registration ────────────────────────────────────────────────────
  consul-reg-g3:
    image: curlimages/curl:latest
    container_name: g3-consul-reg
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 15
        for svc in \
          "jellyfin|${MESH_SERVER_IP:-10.10.3.1}|8096|media,streaming" \
          "jellyseerr|${MESH_SERVER_IP:-10.10.3.1}|5055|media,requests" \
          "sonarr|${MESH_SERVER_IP:-10.10.3.1}|8989|media,automation" \
          "radarr|${MESH_SERVER_IP:-10.10.3.1}|7878|media,automation" \
          "prowlarr|${MESH_SERVER_IP:-10.10.3.1}|9696|media,indexers" \
          "qbittorrent|${MESH_SERVER_IP:-10.10.3.1}|8080|media,downloads" \
          "npm|${MESH_SERVER_IP:-10.10.3.1}|81|edge,proxy,tls" \
          "monarch-api|${MESH_SERVER_IP:-10.10.3.1}|3100|media,intelligence"; do
          NAME=$(echo "$svc" | cut -d'|' -f1)
          ADDR=$(echo "$svc" | cut -d'|' -f2)
          PORT=$(echo "$svc" | cut -d'|' -f3)
          TAGS=$(echo "$svc" | cut -d'|' -f4)
          curl -s -X PUT http://consul:8500/v1/agent/service/register \
            -H 'Content-Type: application/json' \
            -d "{\"Name\":\"$NAME\",\"Address\":\"$ADDR\",\"Port\":$PORT,\"Tags\":[\"${TAGS// /\", \"}\"]}" \
            >/dev/null
          echo "[g3] Registered $NAME at $ADDR:$PORT"
        done
    networks:
      - default
      - innotel-mesh-net

volumes:
  npm-data:
  npm-letsencrypt:
  jellyfin-config:
  jellyfin-cache:
  jellyseerr-config:
  sonarr-config:
  radarr-config:
  lidarr-config:
  prowlarr-config:
  qbittorrent-config:
  sabnzbd-config:
  nextpvr-config:
  tvheadend-config:

networks:
  default:
    name: g3-net
  innotel-mesh-net:
    external: true
