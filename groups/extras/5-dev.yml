# ══════════════════════════════════════════════════════════════════════════
# Group 5 — the wiring this group owns, not a member repo's services.
#
# Read verbatim into `groups/5-dev.yml` by `ips/scripts/gen-group-compose.py`.
# Keep it to what no repo declares: the Consul registration, the mesh network,
# and services whose compose lives outside the member repos (Tutor's LMS,
# Oasis's single mail image). Paths are relative to `ips/groups/`, where the
# generated file sits.
# ══════════════════════════════════════════════════════════════════════════

services:
  oasis-mail:
    build:
      context: ../../5-dev/oasis   # relative to ips/groups/, where this is read
    container_name: g5-oasis-mail
    restart: unless-stopped
    ports:
      - "${OASIS_SMTP_PORT:-587}:587"
      - "${OASIS_IMAP_PORT:-993}:993"
      - "${OASIS_WEB_PORT:-8443}:443"
    environment:
      DATABASE_URL: postgresql://oasis:${OASIS_PG_PASSWORD}@postgres:5432/oasis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTHENTIK_BASE_URL: https://auth.cerulean.innotel.us
    depends_on:
      - postgres
      - redis
    networks:
      - default
      - innotel-mesh-net

  # ═══ DISTRO (BuilderOps — in-browser AI app builder) ══════════════════════════
  # Distro's own compose (control plane + web). The AI plane is the shared
  # Group-2 OmniRoute on the mesh — no bundled gateway, so nothing here binds
  # 20128/20129/20132. Distro env comes from the root .env (see .env.example,
  # "Distro (Group 5)"), plus the MESH_GATEWAY_HOST default below.
  # docs/convergence-onyx-olympus-distro-atlas.md §4.2.

  consul-reg-g5:
    image: curlimages/curl:latest
    container_name: g5-consul-reg
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 15
        for svc in \
          "gitea|${MESH_SERVER_IP:-10.10.5.1}|3000|dev,git,code" \
          "olympus-studio|${MESH_SERVER_IP:-10.10.5.1}|3001|dev,build,studio" \
          "convex|${MESH_SERVER_IP:-10.10.5.1}|3210|dev,build,convex" \
          "oasis-mail|${MESH_SERVER_IP:-10.10.5.1}|587|mail,smtp" \
          "distro-control-plane|${MESH_SERVER_IP:-10.10.5.1}|20140|dev,accounts,quota"; do
          NAME=$(echo "$$svc" | cut -d'|' -f1)
          ADDR=$(echo "$$svc" | cut -d'|' -f2)
          PORT=$(echo "$$svc" | cut -d'|' -f3)
          TAGS=$(echo "$$svc" | cut -d'|' -f4)
          curl -s -X PUT http://${REGISTRY_ADDR:-mesh-consul:8500}/v1/agent/service/register \
            -H 'Content-Type: application/json' \
            -d "{\"Name\":\"$$NAME\",\"Address\":\"$$ADDR\",\"Port\":$$PORT,\"Tags\":[\"$${TAGS// /\", \"}\"]}" \
            >/dev/null
          echo "[g5] Registered $$NAME at $$ADDR:$$PORT"
        done
    networks:
      - default
      - innotel-mesh-net

networks:
  default:
    name: g5-net
  innotel-mesh-net:
    external: true
