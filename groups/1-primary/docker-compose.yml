# ══════════════════════════════════════════════════════════════════════════════
# Group 1 — PRIMARY
# Cerulean (Authentik + DNS/certs) + AthenIQ (Open edX LMS) + Magnate (billing)
# + Signara (DocumentOps — signed course certificates) + Consul service registry
# server + joins the shared WireGuard mesh
# ══════════════════════════════════════════════════════════════════════════════
# RAM: ~10 GiB | Ports: 3003, 9000, 9443, 18080, 3010, 8000, 3000, 8500, 51820
# ══════════════════════════════════════════════════════════════════════════════

name: innotel-group1

services:
  # ═══ CERULEAN ═════════════════════════════════════════════════════════════
  # Auth & trust backbone — Authentik SSO, Infisical secrets, Vault
  # (Consul server comes from the included mesh compose; stack.sh sets
  #  CONSUL_SERVER_FLAG=-server=true for this group)

  cerulean:
    build:
      context: ../../../cerulean-dns-platform
    container_name: g1-cerulean
    restart: unless-stopped
    env_file: ../../../cerulean-dns-platform/.env
    ports:
      - "${CERULEAN_PORT:-3003}:3003"
    volumes:
      - cerulean-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - innotel-mesh-net

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG:-2024.12.2}
    container_name: g1-authentik-server
    restart: unless-stopped
    command: server
    env_file: ../../../cerulean-dns-platform/.env
    environment:
      AUTHENTIK_REDIS__HOST: g1-authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: g1-authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set in .env}
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - default
      - innotel-mesh-net

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG:-2024.12.2}
    container_name: g1-authentik-worker
    restart: unless-stopped
    command: worker
    env_file: ../../../cerulean-dns-platform/.env
    environment:
      AUTHENTIK_REDIS__HOST: g1-authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: g1-authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set in .env}
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - default
      - innotel-mesh-net

  authentik-postgres:
    image: postgres:16-alpine
    container_name: g1-authentik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASSWORD:?set in .env}
    volumes:
      - authentik-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  authentik-redis:
    image: redis:7-alpine
    container_name: g1-authentik-redis
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes:
      - authentik-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  infisical:
    image: lukechann/infisical:latest
    container_name: g1-infisical
    restart: unless-stopped
    environment:
      INFISICAL_DATABASE_URL: postgresql://infisical:${INFISICAL_PG_PASSWORD}@g1-infisical-db:5432/infisical
      INFISICAL_REDIS_URL: redis://g1-infisical-redis:6379
      SITE_URL: https://secrets.cerulean.innotel.us
    ports:
      - "8080:8080"
    depends_on:
      - infisical-db
      - infisical-redis
    networks:
      - default
      - innotel-mesh-net

  infisical-db:
    image: postgres:16-alpine
    container_name: g1-infisical-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_PG_PASSWORD:-infisicalpass}
    volumes:
      - infisical-db:/var/lib/postgresql/data
    networks:
      - default

  infisical-redis:
    image: redis:7-alpine
    container_name: g1-infisical-redis
    restart: unless-stopped
    networks:
      - default

  vault:
    image: hashicorp/vault:latest
    container_name: g1-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
    volumes:
      - vault-data:/vault/file
    ports:
      - "8200:8200"
    command: server -dev -dev-root-token-id=root
    networks:
      - default
      - innotel-mesh-net

  # ═══ ATHENIQ (Open edX LMS) ══════════════════════════════════════════════
  # Tutor manages its own containers; we reference the tutor compose here.
  # For production, run: sudo -u tutor tutor local start
  # This block is the tutor-managed stack for reference.

  tutor-mysql:
    image: docker.io/mysql:8.4.11
    container_name: g1-tutor-mysql
    restart: unless-stopped
    command: >
      mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --binlog-expire-logs-seconds=259200 --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${TUTOR_MYSQL_ROOT_PASSWORD:?set in .env}
    volumes:
      - tutor-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - innotel-mesh-net

  tutor-mongodb:
    image: docker.io/mongo:7.0.39
    container_name: g1-tutor-mongodb
    restart: unless-stopped
    command: mongod --storageEngine wiredTiger
    user: "999:999"
    volumes:
      - tutor-mongodb:/data/db
    networks:
      - default

  tutor-redis:
    image: docker.io/redis:7.4.10
    container_name: g1-tutor-redis
    restart: unless-stopped
    volumes:
      - tutor-redis:/data
    networks:
      - default

  tutor-lms:
    image: docker.io/overhangio/openedx:22.0.2
    container_name: g1-tutor-lms
    restart: unless-stopped
    command: ./lms.sh gunicorn -b 0.0.0.0:18000 -w 2 --timeout 120
    environment:
      SERVICE_VARIANT: lms
      DJANGO_SETTINGS_MODULE: lms.envs.tutor.production
    volumes:
      - tutor-lms-data:/openedx/data
    depends_on:
      - tutor-mysql
      - tutor-mongodb
      - tutor-redis
    networks:
      - default
      - innotel-mesh-net

  tutor-cms:
    image: docker.io/overhangio/openedx:22.0.2
    container_name: g1-tutor-cms
    restart: unless-stopped
    command: ./cms.sh gunicorn -b 0.0.0.0:18001 -w 2 --timeout 120
    environment:
      SERVICE_VARIANT: cms
      DJANGO_SETTINGS_MODULE: cms.envs.tutor.production
    volumes:
      - tutor-cms-data:/openedx/data
    depends_on:
      - tutor-mysql
      - tutor-mongodb
      - tutor-redis
    networks:
      - default
      - innotel-mesh-net

  tutor-caddy:
    image: docker.io/overhangio/tutor:22.0.2
    container_name: g1-tutor-caddy
    restart: unless-stopped
    ports:
      - "${OPENEDX_CADDY_PORT:-18080}:80"
    depends_on:
      - tutor-lms
      - tutor-cms
    networks:
      - default
      - innotel-mesh-net

  tutor-meilisearch:
    image: docker.io/getmeili/meilisearch:v1.36.0
    container_name: g1-tutor-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${TUTOR_MEILI_KEY:-miFS50LGWh0Uc75s5upoe3ER}
    volumes:
      - tutor-meilisearch:/meili_data
    networks:
      - default

  # ═══ MAGNATE (Billing) ═══════════════════════════════════════════════════
  magnate:
    build:
      context: ../../../magnate-subscription-platform
    container_name: g1-magnate
    restart: unless-stopped
    ports:
      - "${MAGNATE_PORT:-3010}:3010"
    environment:
      DATABASE_URL: postgresql://magnate:${MAGNATE_PG_PASSWORD:-magnatepass}@magnate-db:5432/magnate
      AUTHENTIK_BASE_URL: https://auth.cerulean.innotel.us
      AUTHENTIK_CLIENT_ID: magnate
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      - magnate-db
    networks:
      - default
      - innotel-mesh-net

  magnate-db:
    image: postgres:16-alpine
    container_name: g1-magnate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: magnate
      POSTGRES_USER: magnate
      POSTGRES_PASSWORD: ${MAGNATE_PG_PASSWORD:-magnatepass}
    volumes:
      - magnate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # ═══ SIGNARA (DocumentOps — signed course certificates) ═════════════════════
  # Completion records from AthenIQ are pushed here by scripts/cert-bridge.py
  # and run through Signara's signing workflow (single Authentik = Cerulean).

  signara-postgres:
    image: postgres:16-alpine
    container_name: g1-signara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signara}
      POSTGRES_PASSWORD: ${SIGNARA_PG_PASSWORD:-signarapass}
      POSTGRES_DB: ${POSTGRES_DB:-signara}
    volumes:
      - signara-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signara}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  signara-redis:
    image: redis:7-alpine
    container_name: g1-signara-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${SIGNARA_REDIS_PASSWORD:-signararedis}", "--appendonly", "yes"]
    volumes:
      - signara-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SIGNARA_REDIS_PASSWORD:-signararedis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  signara-minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: g1-signara-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-signara}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-signaraminio}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - signara-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - default

  signara-meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: g1-signara-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-change-me}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - signara-meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default

  signara-migrate:
    image: ${SIGNARA_API_IMAGE:-ghcr.io/innotelinc/signara-api:latest}
    container_name: g1-signara-migrate
    env_file: ../../../signara-trust-platform/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-signara}:${SIGNARA_PG_PASSWORD:-signarapass}@signara-postgres:5432/${POSTGRES_DB:-signara}?schema=public
    command: ["node_modules/.bin/prisma", "migrate", "deploy", "--schema", "packages/database/prisma/schema.prisma"]
    depends_on:
      signara-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - default

  signara-api:
    image: ${SIGNARA_API_IMAGE:-ghcr.io/innotelinc/signara-api:latest}
    build:
      context: ../../../signara-trust-platform
      dockerfile: apps/api/Dockerfile
    container_name: g1-signara-api
    restart: unless-stopped
    env_file: ../../../signara-trust-platform/.env
    environment:
      NODE_ENV: production
      API_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-signara}:${SIGNARA_PG_PASSWORD:-signarapass}@signara-postgres:5432/${POSTGRES_DB:-signara}?schema=public
      REDIS_URL: redis://:${SIGNARA_REDIS_PASSWORD:-signararedis}@signara-redis:6379
      S3_ENDPOINT: http://signara-minio:9000
      MEILISEARCH_HOST: http://signara-meilisearch:7700
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-https://auth.cerulean.innotel.us/application/o/signara/jwks/}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-https://auth.cerulean.innotel.us/application/o/token/}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-https://auth.cerulean.innotel.us/application/o/userinfo/}
    ports:
      - "${SIGNARA_API_PORT:-8000}:8000"
    depends_on:
      signara-migrate:
        condition: service_completed_successfully
      signara-postgres:
        condition: service_healthy
      signara-redis:
        condition: service_healthy
      signara-minio:
        condition: service_healthy
      signara-meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default
      - innotel-mesh-net

  signara-frontend:
    image: ${SIGNARA_WEB_IMAGE:-ghcr.io/innotelinc/signara-web:latest}
    build:
      context: ../../../signara-trust-platform
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.signara.innotel.us}
        NEXT_PUBLIC_WEB_URL: ${WEB_URL:-https://app.signara.innotel.us}
    container_name: g1-signara-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.signara.innotel.us}
      NEXT_PUBLIC_WEB_URL: ${WEB_URL:-https://app.signara.innotel.us}
    ports:
      - "${SIGNARA_WEB_PORT:-3000}:3000"
    depends_on:
      signara-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - default
      - innotel-mesh-net

  # ── Consul service registration ─────────────────────────────────────────────
  consul-reg-g1:
    image: curlimages/curl:latest
    container_name: g1-consul-reg
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 15
        for svc in \
          "cerulean|${MESH_SERVER_IP:-10.10.1.1}|3003|auth,primary" \
          "authentik|${MESH_SERVER_IP:-10.10.1.1}|9000|auth,sso,oidc" \
          "infisical|${MESH_SERVER_IP:-10.10.1.1}|8080|secrets,vault" \
          "vault|${MESH_SERVER_IP:-10.10.1.1}|8200|secrets,vault" \
          "lms|${MESH_SERVER_IP:-10.10.1.1}|18080|education,primary" \
          "magnate|${MESH_SERVER_IP:-10.10.1.1}|3010|billing,primary" \
          "signara|${MESH_SERVER_IP:-10.10.1.1}|8000|trust,docs,signing"; do
          NAME=$(echo "$$svc" | cut -d'|' -f1)
          ADDR=$(echo "$$svc" | cut -d'|' -f2)
          PORT=$(echo "$$svc" | cut -d'|' -f3)
          TAGS=$(echo "$$svc" | cut -d'|' -f4)
          curl -s -X PUT http://${REGISTRY_ADDR:-mesh-consul:8500}/v1/agent/service/register \
            -H 'Content-Type: application/json' \
            -d "{\"Name\":\"$$NAME\",\"Address\":\"$$ADDR\",\"Port\":$$PORT,\"Tags\":[\"$${TAGS// /\", \"}\"]}" \
            >/dev/null
          echo "[g1] Registered $$NAME at $$ADDR:$$PORT"
        done
    networks:
      - default
      - innotel-mesh-net

volumes:
  cerulean-data:
  authentik-media:
  authentik-templates:
  authentik-postgres:
  authentik-redis:
  infisical-db:
  vault-data:
  tutor-mysql:
  tutor-mongodb:
  tutor-redis:
  tutor-lms-data:
  tutor-cms-data:
  tutor-meilisearch:
  magnate-db:
  signara-postgres:
  signara-redis:
  signara-minio:
  signara-meili:

networks:
  default:
    name: g1-net
  innotel-mesh-net:
    external: true
