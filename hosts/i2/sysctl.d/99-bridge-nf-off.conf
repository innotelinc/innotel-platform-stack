# n8n's sandbox runner (inside `capstone`) will not start unless
# /proc/sys/net/bridge/bridge-nf-call-iptables exists, i.e. unless br_netfilter is
# loaded. This host carries the containers' LAN addresses over br0 (capstone is
# 192.168.1.30) and ontrak0, so bridged frames must not traverse iptables: 0 still
# leaves the file present, which is all the runner checks. systemd-sysctl runs
# after systemd-modules-load, so this is applied to the loaded module at boot.
#
# See hosts/i2/README.md. Do not unload the module to roll this back - set these
# back to 1; `modprobe -r br_netfilter` deletes every bridge on the host.
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0
