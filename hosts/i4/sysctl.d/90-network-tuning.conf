# Network tuning for i4's 1 GbE USB uplink (br-lan)
#
# The NIC negotiates 1000 Mb/s full duplex. Measured on 2026-10-09 before tuning:
# ~163 Mbit/s down / ~24 Mbit/s up to the internet, limited by the WAN plan and
# by stock 4 MiB socket buffers rather than by the link. After tuning the host
# and the containers measure the same throughput, so the bridge adds nothing.

# BBR + fq: better throughput and lower latency than cubic on rate-limited or
# lossy paths. tcp_bbr ships as a module here and loads on demand.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Socket buffers. Stock rmem_max of 4 MiB caps a single flow well below 1 GbE
# once RTT grows; raise the ceilings and the default so proxy/edge traffic is not
# window-limited.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 262144 16777216
net.ipv4.tcp_wmem = 4096 262144 16777216

# Backlogs: sized for gigabit bursts and for many containers behind one bridge.
net.core.netdev_max_backlog = 5000
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192

# Containers serve small, bursty requests; restarting the congestion window
# after every idle gap punishes exactly that pattern.
net.ipv4.tcp_slow_start_after_idle = 0

# Recover from PMTU black holes rather than stalling (the vpn container tunnels
# traffic, which is where black holes usually appear).
net.ipv4.tcp_mtu_probing = 1
