# i1 only. `systemd/vault-replica-sync.service` says a failed run has to say so — a nightly
# mirror that stops running looks exactly like a nightly mirror with nothing to do — and this
# drop-in is what makes the failure say so on this host. It lived only in
# /etc/systemd/system until 2026-11-15, working, and invisible to anyone reading the
# repository: the unit there names no OnFailure= at all.
#
# `scripts/check-unit-drift.py` compares `hosts/<host>/systemd/` for the host it is checking,
# so an override kept here cannot go quiet again.
[Unit]
OnFailure=estate-notify@%n
