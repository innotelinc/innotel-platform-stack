# `regcache` runs on i2, not here: `incus list i2:` shows it RUNNING with the
# `registry` container serving 192.168.1.79:5000, while the instance of the same name
# on i1 is STOPPED (last used 2026/11/16 02:18) and has no `registry` container in it.
# The check runs `incus exec $INCUS -- docker …`, so without this it interrogates the
# dead local copy and reports `CANNOT RUN: no container registry in regcache` — the
# subject, not the credential. With it, the check exits 0 and the token is verified.
[Service]
Environment=INCUS=i2:regcache
