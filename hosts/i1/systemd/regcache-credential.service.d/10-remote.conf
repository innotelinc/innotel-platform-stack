# `regcache` runs on i2, not here: `incus list i2:` shows it RUNNING with the
# `registry` container serving 192.168.1.79:5000, and i1 holds no instance of that
# name at all. The check runs `incus exec $INCUS -- docker …`, so without this it
# asks this host for an instance that does not exist and reports `CANNOT RUN: no
# container registry in regcache` — the subject, not the credential. With it, the
# check exits 0 and the token itself is verified.
[Service]
Environment=INCUS=i2:regcache
