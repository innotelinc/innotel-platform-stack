# i1 only. `systemd/swap-ceiling-check.service` deliberately carries no OnFailure=, because
# this check exits 1 on a *standing* condition and the timer runs every ten minutes, so wiring
# it notifies on every run for as long as the condition lasts (the unit's own header explains
# the reasoning). This host wanted the notification anyway, and the override lived only in
# /etc/systemd/system until 2026-11-15: nothing in the repository recorded it, so the next
# person to read `systemd/` saw a check with no notification at all.
#
# Keeping the drop-in here is what makes that decision reviewable, and the unit drift check
# compares it on every run, so a host-local edit shows up as drift instead of a mystery.
[Unit]
OnFailure=estate-notify@%n
