# Redis in the `monarch` container (the Homarr dashboard, `192.168.1.56`) refuses
# background saves without memory overcommit and logs this on every start:
#
#   # WARNING Memory overcommit must be enabled! Without it, a background save
#   # or replication may fail under low memory condition.
#
# `vm.overcommit_memory` is a kernel setting shared by the whole machine and is
# not namespaced, so the container cannot set it - `sysctl -w` inside `monarch`
# fails with "permission denied on key". It has to be applied here, on the host
# that runs the container.
#
# See `3-media/monarch/docs/operations.md` ("Redis logs Memory overcommit must be
# enabled") and `hosts/i1/README.md`.
vm.overcommit_memory = 1
