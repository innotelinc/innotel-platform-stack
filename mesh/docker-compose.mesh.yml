# ══════════════════════════════════════════════════════════════════════════════
# WireGuard Mesh — cross-network overlay for all Innotel groups
# ══════════════════════════════════════════════════════════════════════════════
# Each group compose `include`s this file, so every server runs:
#   - a WireGuard node joining the 10.10.0.0/16 overlay
#   - a Consul agent (server on Group 1, client everywhere else)
#
# Cross-server traffic flows: container → mesh-net → wg tunnel → mesh-net on
# the other server → target container.  Services discover each other through
# Consul, which returns mesh IPs (10.10.x.x) reachable over the tunnel.
# ══════════════════════════════════════════════════════════════════════════════

name: innotel-mesh

services:
  # ── WireGuard ──────────────────────────────────────────────────────────────
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: mesh-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=0
      - PGID=0
      - TZ=UTC
      - SERVERURL=${SERVER_PUBLIC_IP}
      - SERVERPORT=${MESH_PORT:-51820}
      - PEERS=${MESH_PEERS:-4}
      - PEERDNS=1.1.1.1
      - INTERNAL_SUBNET=${MESH_SUBNET:-10.10.1.0}
      - ALLOWEDIPS=${MESH_ALLOWEDIPS:-10.10.0.0/16}
    volumes:
      - ./wg/data:/config
      - /lib/modules:/lib/modules
    ports:
      - "${MESH_PORT:-51820}:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mesh-net

  # ── Consul agent (server on Group 1, client elsewhere) ────────────────────
  consul:
    image: hashicorp/consul:1.19
    container_name: mesh-consul
    restart: unless-stopped
    volumes:
      - ./registry/data:/consul/data
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: >
      agent
        -bind=0.0.0.0
        -client=0.0.0.0
        -datacenter=innotel
        -data-dir=/consul/data
        -ui
        -retry-join=${CONSUL_SERVER_ADDR:-10.10.1.1}
        ${CONSUL_SERVER_FLAG:-}
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - mesh-net

networks:
  mesh-net:
    name: innotel-mesh-net