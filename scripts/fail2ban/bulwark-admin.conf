# fail2ban filter — failed Bulwark administrator logins.
#
# Bulwark records `admin.login_failed` at /api/admin/auth and answers 401 (or
# 429 once its own throttle trips). A desktop browser that still holds an old
# admin password retries on a timer, which is what a 10-minute cadence looks
# like — so the jail counts *failures from one address*, never a success.
#
# Matches the usual combined/Coolify access-log line, e.g.
#   192.0.2.10 - - [26/Nov/2026:09:30:11 +0000] "POST /api/admin/auth HTTP/1.1" 401 27 ...
#
# LAN ranges are whitelisted in the jail (ignoreip); this filter only names the
# offender.
[Definition]

failregex = <HOST>[^"]*"POST /api/admin/auth[^"]*" (?:401|429) \d+

ignoreregex =

# Bulwark also serves the page route on GET; a GET is a page view, not a login
# attempt, and is deliberately not counted.
