# fail2ban filter — failed Bulwark administrator logins.
#
# Bulwark records `admin.login_failed` at /api/admin/auth and answers 401 (or
# 429 once its own throttle trips). A browser that still holds an old admin
# password retries on a timer, which looks exactly like a slow, steady attack:
# one attempt every few minutes from one address, forever.
#
# Two line formats are recognised:
#
#   Nginx Proxy Manager (the client address comes last):
#     [26/Nov/2026:09:30:11 -0500] - 401 401 - POST https mail.example "/api/admin/auth" [Client 192.0.2.10] ...
#
#   combined / Coolify:
#     192.0.2.10 - - [26/Nov/2026:09:30:11 +0000] "POST /api/admin/auth HTTP/1.1" 401 27 ...
#
# fail2ban strips a leading `[timestamp]` before applying the regex, so the NPM
# rule starts after it. LAN ranges are whitelisted in the jail (ignoreip); this
# filter only names the offender.
[Definition]

__prefix_line =

failregex = (?:401|429) \S+ - POST https? \S+ "[^"]*api/admin/auth[^"]*" \[Client <HOST>\]
            <HOST>[^"]*"POST /api/admin/auth[^"]*" (?:401|429) \d+

ignoreregex =

# A GET is a session probe or a page view, never a credential submission, and is
# deliberately not counted — the mail UI probes this endpoint on every load.
